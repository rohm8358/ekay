[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekay"
version = "2.0.0"
description = "EKay — red-team kill-chain MCP orchestrator (phases + findings, beyond HexStrike)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rohm", email = "rohm8358@users.noreply.github.com" }]
dependencies = [
  "flask>=3.0.0",
  "waitress>=3.0.0",
  "mcp>=1.2.0,<2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ekay = "ekay.cli:main"

[tool.setuptools.packages.find]
include = ["ekay*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
